<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Responsive Blog</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: var(--transition);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navbar */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box input {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            outline: none;
        }

        .theme-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        /* Categories Bar */
        .categories-bar {
            display: flex;
            gap: 10px;
            padding: 15px 0;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .cat-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Hero / Featured Section */
        .featured-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Blog Grid */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Blog Card */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-tag {
            align-self: flex-start;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .card-excerpt {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Load More Button */
        .load-more-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .btn-primary {
            padding: 10px 24px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Single Post View */
        .hidden {
            display: none !important;
        }

        .post-detail {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .post-header {
            margin-bottom: 20px;
        }

        .post-header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .post-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .post-hero-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 30px;
        }

        .post-body {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .social-share {
            display: flex;
            gap: 10px;
            margin: 30px 0;
            padding: 15px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .share-btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
        }

        /* Comments Section */
        .comments-section {
            margin-top: 40px;
        }

        .comment-form textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            margin-bottom: 10px;
            resize: vertical;
        }

        .comment-list {
            margin-top: 20px;
        }

        .comment-item {
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 40px 0;
            margin-top: auto;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="#" class="logo" onclick="showListView()">TechPulse</a>
            <div class="nav-controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search articles..." oninput="filterPosts()">
                </div>
                <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <main id="listView">
            <div class="categories-bar" id="categoryBar">
                <button class="cat-btn active" onclick="filterCategory('All')">All</button>
                <button class="cat-btn" onclick="filterCategory('Technology')">Technology</button>
                <button class="cat-btn" onclick="filterCategory('Design')">Design</button>
                <button class="cat-btn" onclick="filterCategory('Cybersecurity')">Cybersecurity</button>
                <button class="cat-btn" onclick="filterCategory('AI')">AI</button>
            </div>

            <div class="blog-grid" id="blogGrid"></div>

            <div class="load-more-container">
                <button class="btn-primary" id="loadMoreBtn" onclick="loadMorePosts()">Load More</button>
            </div>
        </main>

        <article id="detailView" class="post-detail hidden">
            <button class="back-btn" onclick="showListView()">← Back to Articles</button>
            <div id="postContent"></div>
            
            <div class="social-share">
                <span>Share:</span>
                <button class="share-btn" onclick="alert('Shared to X!')">X / Twitter</button>
                <button class="share-btn" onclick="alert('Shared to LinkedIn!')">LinkedIn</button>
                <button class="share-btn" onclick="alert('Link copied!')">Copy Link</button>
            </div>

            <section class="comments-section">
                <h3>Comments</h3>
                <form class="comment-form" onsubmit="addComment(event)">
                    <textarea id="commentInput" placeholder="Write a comment..." required></textarea>
                    <button type="submit" class="btn-primary">Submit Comment</button>
                </form>
                <div class="comment-list" id="commentList"></div>
            </section>
        </article>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 TechPulse. Designed for readability and responsive performance.</p>
        </div>
    </footer>

    <script>
        // Sample Blog Dataset
        const postsData = [
            {
                id: 1,
                title: "The Shift Toward Modular Web Design Systems",
                category: "Design",
                date: "Aug 28, 2026",
                image: "https://picsum.photos/seed/design/600/400",
                excerpt: "Explore how design systems streamline multi-device responsive web apps with consistent layout patterns.",
                content: "<p>Design systems serve as the single source of truth for design tokens, typography, and layout foundations across web applications. By breaking down standard page structures into modular web components, engineers can maintain consistency regardless of scale.</p><p>Key implementations focus on flexbox and modern CSS Grid for device-independent structural adaptability.</p>"
            },
            {
                id: 2,
                title: "Understanding Zero Trust Security Architecture",
                category: "Cybersecurity",
                date: "Aug 22, 2026",
                image: "https://picsum.photos/seed/cyber/600/400",
                excerpt: "Why modern network security requires continuous verification instead of implicit internal network trust.",
                content: "<p>The core principle of Zero Trust architecture is simple: never trust, always verify. Security frameworks must mandate continuous explicit validation across identities, devices, network environments, and applications.</p><p>As perimeter boundaries blur, end-to-end telemetry and identity-based boundaries become essential infrastructure priorities.</p>"
            },
            {
                id: 3,
                title: "Optimizing Client-Side Performance in Modern Browsers",
                category: "Technology",
                date: "Aug 15, 2026",
                image: "https://picsum.photos/seed/tech/600/400",
                excerpt: "Practical strategies for reducing render-blocking resources and keeping layout shifts minimal.",
                content: "<p>Fast user interfaces rely on minimizing main-thread blocking operations. Utilizing content visibility CSS, dynamic asset loading, and optimized web fonts ensures page rendering stays snappy across mobile and desktop connections.</p><p>Regular monitoring of dynamic interaction metrics leads directly to better retention.</p>"
            },
            {
                id: 4,
                title: "Practical Applications of Neural Workflows in Engineering",
                category: "AI",
                date: "Aug 05, 2026",
                image: "https://picsum.photos/seed/ai/600/400",
                excerpt: "Integrating generative intelligence models directly into development automation pipelines.",
                content: "<p>Automated software generation pipelines are evolving past basic autocomplete to support structural code review, test case synthesis, and intelligent static analysis.</p><p>Integrating context-aware models reduces developer overhead and catches edge cases early in the execution sequence.</p>"
            }
        ];

        let visibleCount = 3;
        let selectedCategory = 'All';
        let searchQuery = '';

        // Render Posts Grid
        function renderPosts() {
            const grid = document.getElementById('blogGrid');
            grid.innerHTML = '';

            const filtered = postsData.filter(post => {
                const matchesCat = selectedCategory === 'All' || post.category === selectedCategory;
                const matchesSearch = post.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     post.excerpt.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const toDisplay = filtered.slice(0, visibleCount);

            if (toDisplay.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">No articles found matching your criteria.</p>`;
                return;
            }

            toDisplay.forEach(post => {
                const card = document.createElement('article');
                card.className = 'card';
                card.onclick = () => openPost(post.id);
                card.innerHTML = `
                    <img class="card-img" src="${post.image}" alt="${post.title}">
                    <div class="card-body">
                        <span class="card-tag">${post.category}</span>
                        <h2 class="card-title">${post.title}</h2>
                        <p class="card-excerpt">${post.excerpt}</p>
                        <span class="card-date">${post.date}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (visibleCount >= filtered.length) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'inline-block';
            }
        }

        // Filtering Controls
        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderPosts();
        }

        function filterPosts() {
            searchQuery = document.getElementById('searchInput').value;
            renderPosts();
        }

        function loadMorePosts() {
            visibleCount += 2;
            renderPosts();
        }

        // Views Toggle
        function openPost(id) {
            const post = postsData.find(p => p.id === id);
            if (!post) return;

            document.getElementById('postContent').innerHTML = `
                <div class="post-header">
                    <span class="card-tag">${post.category}</span>
                    <h1>${post.title}</h1>
                    <div class="post-meta">Published on ${post.date}</div>
                </div>
                <img class="post-hero-img" src="${post.image}" alt="${post.title}">
                <div class="post-body">${post.content}</div>
            `;

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showListView() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
        }

        // Dark Mode Toggle
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            document.getElementById('themeToggle').innerText = target === 'dark' ? '☀️' : '🌙';
        }

        // Comment System Simulation
        function addComment(e) {
            e.preventDefault();
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const commentList = document.getElementById('commentList');
            const item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `<strong>Reader:</strong> <p>${text}</p>`;
            commentList.prepend(item);

            input.value = '';
        }

        // Initial Load
        renderPosts();
    </script>
</body>
</html>
